services:
  redis:
    image: redis:7-alpine
    container_name: job-processing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-insight:
    image: redis/redisinsight:latest
    container_name: job-processing-redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy

  k6:
    image: grafana/k6:latest
    container_name: job-processing-k6
    profiles: ["test"]
    volumes:
      - ./k6:/scripts
    environment:
      - BASE_URL=http://host.docker.internal:3000
      - API_KEY_STANDARD=${API_KEY_STANDARD:-key_std_prod_123}
      - API_KEY_VIP=${API_KEY_VIP:-key_vip_prod_456}
      - API_KEY_ADMIN=${API_KEY_ADMIN:-key_admin_prod_789}
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
  redisinsight_data:

